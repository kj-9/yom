name: Publish Bun Package

on:
  release:
    types:
      - published

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checks
        run: bun run check

      - name: Check formatting
        run: bun run format

      - name: Compile package
        run: bun run compile

      - name: Run tests
        run: bun run test

      - name: Check tree performance
        run: bun run benchmark

      - name: Test packed package
        run: bun run test:package

      - name: Install browser for end-to-end tests
        run: bunx playwright install --with-deps chromium chromium-headless-shell

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Build package
        run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Publish package
        run: bun run release
