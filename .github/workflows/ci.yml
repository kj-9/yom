name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun-version: latest
          - os: macos-latest
            bun-version: latest
          - os: ubuntu-latest
            bun-version: 1.3.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checks
        run: bun run check

      - name: Check formatting
        run: bun run format

      - name: Run tests
        run: bun run test

      - name: Check tree performance
        run: bun run benchmark

      - name: Test packed package
        run: bun run test:package

      - name: Install browser for end-to-end tests on Linux
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium chromium-headless-shell

      - name: Install browser for end-to-end tests on macOS
        if: runner.os == 'macOS'
        run: bunx playwright install chromium chromium-headless-shell

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Build package
        run: bun run build
