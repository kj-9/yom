schema: spec-driven

context: |
  Language: Japanese (ja-JP)
  All artifacts must be written in Japanese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: yom is a local Markdown tree viewer and static site builder.
  Tech stack: TypeScript, Bun, Vite, Vitest, and Playwright.
  Development and static builds must preserve the same rendering and interactions.
  Preserve unrelated changes already present in the worktree.
  The default document language is und; do not infer it from Markdown body text.
  Keep README.md and README.ja.md aligned when user-facing behavior changes.

rules:
  proposal:
    - State user-visible behavior, non-goals, and compatibility impact.
  tasks:
    - Include focused tests for changed behavior.
    - End implementation work by running ./scripts/check.sh.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
